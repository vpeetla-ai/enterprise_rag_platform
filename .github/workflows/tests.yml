name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vpeetla-ai/golden-eval-registry
          path: golden-eval-registry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Install golden-eval-registry (shared eval fixtures + scorer)
        run: python -m pip install -e ./golden-eval-registry
      - name: Run tests (includes the real golden-eval-registry merge gate)
        run: PYTHONPATH=src python -m unittest discover -s tests -v
