# S3.1 (Top-1% plan D2): starter = always-on for Principal panels (no free-tier spin-down).
# Live hostname may remain enterprise-rag-api-4el1.onrender.com after rename — update demo proxies if needed.
#
# P1 (90/100 plan): dual Demo + Strict services — PRODUCTION_STRICT is process env, so two services.
services:
  - type: web
    name: enterprise-rag-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: AEGISAI_GATEWAY_ENABLED
        value: "false"
      - key: QDRANT_BACKEND
        value: "false"
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
      - key: LANGFUSE_ENABLED
        value: "true"
      - key: PRODUCTION_STRICT
        value: "false"
      - key: RAG_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: "hash"
      - key: RAG_RERANKER
        value: "score_boost"
      - key: GENERATOR
        value: "extractive"
      - key: MOCK_LLM
        value: "true"

  - type: web
    name: enterprise-rag-api-strict
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: AEGISAI_GATEWAY_ENABLED
        value: "false"
      - key: QDRANT_BACKEND
        value: "false"
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: PRODUCTION_STRICT
        value: "true"
      - key: RAG_JWT_SECRET
        sync: false
      - key: RAG_API_KEY
        sync: false
      - key: LANGFUSE_ENABLED
        value: "false"
      - key: EMBEDDING_PROVIDER
        value: "hash"
      - key: RAG_RERANKER
        value: "cross_encoder"
      - key: GENERATOR
        value: "extractive"
      - key: CORS_ORIGINS
        value: "https://enterprise-rag-platform-eta.vercel.app,http://localhost:3000"
